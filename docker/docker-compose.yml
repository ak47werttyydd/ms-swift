# docker-compose.yml for ms-swift KD Training
#
# Usage:
#   docker-compose up -d KD
#   docker exec -it kd bash
#   docker-compose down KD

# ----- Shared config -----
x-common: &common
  image: daal/ms-swift:v0
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  pid: host
  ipc: host
  ulimits:
    memlock: -1
    stack: 67108864
  network_mode: host
  environment: &common-env
    - NGPU=8
    - CUDA_DEVICE_ORDER=PCI_BUS_ID
    - NVIDIA_REQUIRE_IMEX_CHANNELS=1
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility     # training needed CUDA capability
    - NCCL_DEBUG=WARN 
    - NCCL_ASYNC_ERROR_HANDLING=1   # report hangs as errors, not silent blocks                                                                                          
    - NCCL_TIMEOUT=1800             # 30min timeout before NCCL raises an error                                                                                          
    - NCCL_P2P_DISABLE=0            # keep NVSwitch P2P enabled (don't fall back)                                                                                        
    - NCCL_SHM_DISABLE=0            # keep SHM path enabled  
    - HF_HOME=/dev/shm/HF_HOME
    - MODELSCOPE_CACHE=/dev/shm/ms_cache
    - WANDB_API_KEY=${WANDB_API_KEY:-}
    - MASTER_ADDR=${MASTER_ADDR:-localhost}
    - MASTER_PORT=${MASTER_PORT:-29500}
  volumes:
    - /home:/home
    - /dev/shm:/dev/shm
  working_dir: /home
  stdin_open: true
  tty: true
  restart: unless-stopped
  command: /bin/bash

services:
  KD:
    <<: *common
    container_name: kd
    entrypoint: /home/a84400789/ms-swift/docker/entrypoint.sh
