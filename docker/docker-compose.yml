# docker-compose.yml — ms-swift GKD Training for Qwen3.5 LatentMoE
#
# Usage:
#   docker compose up -d KD           # start container
#   docker exec -it kd bash           # enter shell
#   docker compose down                # stop
#
# Environment on host:
#   - 8x NVIDIA H100 80GB (GPUs 0-5: student, GPUs 6-7: teacher)
#   - NVIDIA Driver >= 590, CUDA 12.8+
#   - /home mounted into container (model weights, ms-swift source, checkpoints)

x-common: &common
  image: daal/ms-swift:v0
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  pid: host
  ipc: host
  ulimits:
    memlock: -1
    stack: 67108864
  network_mode: host
  environment: &common-env
    - NGPU=8
    - CUDA_DEVICE_ORDER=PCI_BUS_ID
    # NVIDIA
    - NVIDIA_REQUIRE_IMEX_CHANNELS=1
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    # NCCL (multi-GPU communication)
    - NCCL_DEBUG=WARN
    - NCCL_ASYNC_ERROR_HANDLING=1
    - NCCL_TIMEOUT=1800
    - NCCL_P2P_DISABLE=0
    - NCCL_SHM_DISABLE=0
    # Model caches on ramdisk
    - HF_HOME=/dev/shm/HF_HOME
    - MODELSCOPE_CACHE=/dev/shm/ms_cache
    # Optional
    - WANDB_API_KEY=${WANDB_API_KEY:-}
    - MASTER_ADDR=${MASTER_ADDR:-localhost}
    - MASTER_PORT=${MASTER_PORT:-29500}
    # ms-swift source dir (override if different on target server)
    - MS_SWIFT_DIR=${MS_SWIFT_DIR:-/home/a84400789/ms-swift}
  volumes:
    - /home:/home
    - /dev/shm:/dev/shm
  working_dir: /home
  stdin_open: true
  tty: true
  restart: unless-stopped
  command: /bin/bash

services:
  KD:
    <<: *common
    container_name: kd
    entrypoint: /home/a84400789/ms-swift/docker/entrypoint.sh
